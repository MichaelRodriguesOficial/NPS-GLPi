name: Remove old releases (one-off)

# Roda uma vez só: apaga as releases e tags antigas, deixando a v0.65.0
# como a primeira. Este arquivo é removido logo em seguida.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-releases.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v0.64.2 and v0.64.3 (releases and tags)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for tag in v0.64.2 v0.64.3; do
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes || echo "release $tag: não encontrada"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" 2>/dev/null || true
          done
          gh release list --repo "$REPO"
