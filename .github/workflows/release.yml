name: Release

# Publica a release da versão do setup.php: monta o ZIP do plugin (pasta
# npsphere/), cria a tag vX.Y.Z e anexa o ZIP. Se a release dessa versão
# já existe (ajuste na mesma versão), troca o ZIP, atualiza as notas e
# move a tag para o commit novo. Também pode ser disparado à mão
# (Actions › Release › Run workflow).
on:
  push:
    branches: [main]
    paths: ['setup.php', '.github/workflows/release.yml', '.github/release-notes/**', 'src/**', 'front/**', 'ajax/**', 'templates/**', 'public/**', 'hook.php']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: versao
        run: |
          VERSAO=$(grep -oP "PLUGIN_NPSPHERE_VERSION', '\K[0-9.]+" setup.php)
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSAO"

      - name: Check whether this version is already released
        id: existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.versao.outputs.versao }}" >/dev/null 2>&1; then
            echo "atualizar=1" >> "$GITHUB_OUTPUT"; echo "Release já existe: será atualizada."
          fi

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Build npsphere-X.Y.Z.zip
        run: |
          VERSAO="${{ steps.versao.outputs.versao }}"
          mkdir -p /tmp/pacote/npsphere
          rsync -a --exclude '.git' --exclude '.github' --exclude 'docs' --exclude 'screenshots' ./ /tmp/pacote/npsphere/
          (cd /tmp/pacote && zip -qr "$GITHUB_WORKSPACE/npsphere-${VERSAO}.zip" npsphere)
          unzip -l "npsphere-${VERSAO}.zip" | tail -1

      - name: Publish the release
        if: steps.existe.outputs.atualizar != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="${{ steps.versao.outputs.versao }}"
          NOTAS=".github/release-notes/v${VERSAO}.md"
          if [ -f "$NOTAS" ]; then ARG=(--notes-file "$NOTAS"); else ARG=(--generate-notes); fi
          gh release create "v${VERSAO}" "npsphere-${VERSAO}.zip" \
            --target "$GITHUB_SHA" --title "NPSphere ${VERSAO}" "${ARG[@]}" --latest

      # Mesma versão com correções (ex.: ajuste pedido antes de liberar):
      # a release continua a mesma, com o ZIP trocado, as notas atualizadas
      # e a tag apontando para o commit novo.
      - name: Update the existing release
        if: steps.existe.outputs.atualizar == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="${{ steps.versao.outputs.versao }}"
          git tag -f "v${VERSAO}" "$GITHUB_SHA"
          git push -f origin "refs/tags/v${VERSAO}"
          gh release upload "v${VERSAO}" "npsphere-${VERSAO}.zip" --clobber
          NOTAS=".github/release-notes/v${VERSAO}.md"
          if [ -f "$NOTAS" ]; then gh release edit "v${VERSAO}" --notes-file "$NOTAS"; fi
